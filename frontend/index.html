    <!-- Structured Data: SoftwareApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "PrimeCrest Construction Management",
      "applicationCategory": "BusinessApplication",
      "applicationSubCategory": "Construction Project Management",
      "operatingSystem": "Windows, macOS, Linux",
      "softwareVersion": "18.9.0",
      "license": "https://www.gnu.org/licenses/agpl-3.0.html",
      "author": {
        "@type": "Organization",
        "name": "Spyder Solutions"
      },
      "description": "PrimeCrest Construction Management by Spyder Solutions — BOQ editing, cost estimation, CAD/BIM takeoff, scheduling, and tendering."
    }
    </script>

    <meta name="application-name" content="PrimeCrest" />
    <meta name="theme-color" content="#12202B" />

    <!-- Fonts, served from our own origin. No preconnect, no third party.
         Provenance, licences and the reason the cyrillic-ext face is declared
         over one codepoint are in assets/vendor/fonts/README.txt. -->
    <link rel="stylesheet" href="/assets/vendor/fonts/fonts.css" />
    <link rel="stylesheet" href="/assets/vendor/fonts/source-sans-3.css" />
    <link rel="stylesheet" href="/assets/vendor/fonts/fraunces.css" />

    <!-- Appearance boot: puts the saved style (accent, font, density, radius),
         the menu look and the dark class on <html> before first paint, so a reload never
         flashes the default look. Mirrors src/shared/lib/appearance.ts; the
         test src/shared/lib/__tests__/appearanceBoot.test.ts runs this script. -->
    <script id="oe-appearance-boot">
      (function () {
        var allowed = {
          accent: ['blue', 'teal', 'violet', 'emerald', 'amber', 'graphite', 'crimson'],
          font: ['system', 'inter', 'ibm-plex-sans', 'source-sans-3'],
          density: ['comfortable', 'compact'],
          radius: ['standard', 'sharp', 'round'],
          text: ['small', 'default', 'large', 'larger', 'largest']
        };
        var value = { accent: 'blue', font: 'system', density: 'comfortable', radius: 'standard', text: 'default' };
        var customAccent = false;
        function layer(key) {
          try {
            var raw = JSON.parse(localStorage.getItem(key) || 'null');
            if (!raw || typeof raw !== 'object') return;
            for (var axis in allowed) {
              if (allowed[axis].indexOf(raw[axis]) !== -1) value[axis] = raw[axis];
            }
            if (raw.accent || raw.accentHex) customAccent = /^#[0-9a-f]{6}$/i.test(raw.accentHex || '');
          } catch (e) { /* unreadable storage: keep what we have */ }
        }
        layer('oe_workspace_appearance_v1');
        layer('oe_appearance_v1');
        var root = document.documentElement;
        for (var k in value) root.setAttribute('data-' + k, value[k]);
        // A company colour: its stylesheet is cached by src/shared/lib/customAccent.ts.
        try {
          var accentCss = customAccent && localStorage.getItem('oe_custom_accent_css_v1');
          if (accentCss) {
            var accentStyle = document.createElement('style');
            accentStyle.id = 'oe-custom-accent';
            accentStyle.textContent = accentCss;
            document.head.appendChild(accentStyle);
            root.setAttribute('data-accent', 'custom');
          }
        } catch (e) { /* unreadable storage: keep the preset accent */ }
        if (value.font !== 'system') {
          var link = document.createElement('link');
          link.rel = 'stylesheet';
          link.href = '/assets/vendor/fonts/' + value.font + '.css';
          link.setAttribute('data-oe-font', value.font);
          document.head.appendChild(link);
        }
        // Menu look: same layering, painted as data-menu-* (shared/lib/menuAppearance.ts).
        var menuAllowed = {
          view: ['classic', 'compact', 'comfortable', 'rail', 'floating'],
          active: ['bar', 'pill', 'tint'],
          headers: ['caps', 'divider', 'none'],
          stroke: ['light', 'regular', 'bold'],
          container: ['none', 'tile', 'circle'],
          color: ['mono', 'accent', 'sections'],
          icons: ['shown', 'hidden']
        };
        var menu = {
          view: 'classic', active: 'bar', headers: 'caps', stroke: 'regular',
          container: 'none', color: 'mono', icons: 'shown'
        };
        function menuLayer(key) {
          try {
            var raw = JSON.parse(localStorage.getItem(key) || 'null');
            if (!raw || typeof raw !== 'object') return;
            for (var axis in menuAllowed) {
              if (menuAllowed[axis].indexOf(raw[axis]) !== -1) menu[axis] = raw[axis];
            }
          } catch (e) { /* unreadable storage: keep what we have */ }
        }
        menuLayer('oe_workspace_menu_v1');
        menuLayer('oe_menu_v1');
        for (var m in menu) root.setAttribute('data-menu-' + m, menu[m]);
        try {
          var theme = localStorage.getItem('oe_theme');
          var dark = theme === 'dark' || (theme !== 'light' && window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) root.classList.add('dark');
        } catch (e) { /* the theme store applies it after mount */ }
      })();
    </script>
  </head>
  <body class="bg-white text-neutral-900 dark:bg-surface-secondary dark:text-content-primary antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
