[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "primecrest-pakistan-pk"
version = "0.2.0"
description = "PrimeCrest country pack for Pakistan by Spyder Solutions: PKR, federal GST and provincial sales tax on services (PRA, SRB, KPRA), income tax withheld under section 153, PEC standard bidding documents and contractor categories, PPRA procurement, Punjab MRS and provincial CSR rate books, marla and kanal, Urdu."
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.11"
authors = [
    { name = "Spyder Solutions", email = "support@primecrest.pk" },
]
keywords = [
    "primecrest",
    "country-pack",
    "pakistan",
    "pec",
    "ppra",
    "gst",
    "fbr",
    "marla",
    "kanal",
    "pkr",
    "pra",
    "srb",
    "kpra",
    "mrs",
    "csr",
    "urdu",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Intended Audience :: Other Audience",
    "Topic :: Office/Business",
    "Natural Language :: Urdu",
    "Natural Language :: English",
]
dependencies = [
    "primecrest>=18.8.1",
]

[project.urls]
Homepage = "https://primecrest.pk"
Documentation = "https://docs.primecrest.pk"
Source = "https://github.com/spyderps05/PrimeCrestConstMgmt"

[project.entry-points."openconstructionerp.partner_packs"]
pakistan-pk = "openconstructionerp_pakistan_pk:MANIFEST"

[project.entry-points."primecrest.partner_packs"]
pakistan-pk = "openconstructionerp_pakistan_pk:MANIFEST"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openconstructionerp_pakistan_pk = [
    "onboarding.yaml",
    "codes.json",
    "rates.json",
    "rule_packs/*.json",
    "locales/*.json",
    "catalogues/*/*.json",
    "demo/*.json",
]
