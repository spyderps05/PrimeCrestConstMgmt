[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "primecrest-germany-de"
version = "0.1.0"
description = "Flagship country pack for German construction estimating - DIN 276:2018 cost groups, VOB 2019 (Parts A/B/C trade structure), GAEB DA XML 3.3 exchange, HOAI 2021 fee scale, BKI benchmarks, EUR with 19% Umsatzsteuer. German + English UI."
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.11"
authors = [
    { name = "Spyder Solutions", email = "support@primecrest.pk" },
]
keywords = ["primecrest", "partner-pack", "germany", "din276", "gaeb", "vob", "hoai"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Intended Audience :: Other Audience",
    "Topic :: Office/Business",
    "Natural Language :: German",
    "Natural Language :: English",
]
dependencies = [
    "primecrest>=5.5.0",
]

[project.urls]
Source = "https://github.com/spyderps05/PrimeCrestConstMgmt"

[project.entry-points."openconstructionerp.partner_packs"]
germany-de = "openconstructionerp_germany_de:MANIFEST"

[project.entry-points."primecrest.partner_packs"]
germany-de = "openconstructionerp_germany_de:MANIFEST"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openconstructionerp_germany_de = [
    "onboarding.yaml",
    "rule_packs/*.json",
    "procurement_profiles/*.json",
]
