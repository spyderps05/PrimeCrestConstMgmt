[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "primecrest-ukraine-ua"
version = "0.1.0"
description = "Country pack for Ukraine: the twelve chapters of the зведений кошторисний розрахунок under the Настанова (наказ Мінрегіону №281), UAH currency with 20% ПДВ, the ukraine validation rule set, public procurement and ДБН references, Ukrainian estimating practice."
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.11"
authors = [
    { name = "Spyder Solutions", email = "support@primecrest.pk" },
]
keywords = [
    "primecrest",
    "country-pack",
    "ukraine",
    "koshtorys",
    "nastanova-281",
    "prozorro",
    "pdv",
    "uah",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Intended Audience :: Other Audience",
    "Topic :: Office/Business",
    "Natural Language :: Ukrainian",
    "Natural Language :: English",
]
dependencies = [
    "primecrest>=5.5.0",
]

[project.urls]
Source = "https://github.com/spyderps05/PrimeCrestConstMgmt"

[project.entry-points."openconstructionerp.partner_packs"]
ukraine-ua = "openconstructionerp_ukraine_ua:MANIFEST"

[project.entry-points."primecrest.partner_packs"]
ukraine-ua = "openconstructionerp_ukraine_ua:MANIFEST"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openconstructionerp_ukraine_ua = [
    "onboarding.yaml",
    "rule_packs/*.json",
]
