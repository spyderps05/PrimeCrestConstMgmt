[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "primecrest-hungary-hu"
version = "0.1.0"
description = "Country pack for the Hungarian market: the seventeen-chapter building item order, the infrastructure item order with per-project item numbers and code dictionaries, the material and fee split, contingency and VAT on the summary sheet, forint at zero decimals."
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.11"
authors = [
    { name = "Spyder Solutions", email = "support@primecrest.pk" },
]
keywords = [
    "primecrest",
    "country-pack",
    "hungary",
    "tetelrend",
    "koltsegvetes",
    "anyag-dij",
    "afa",
    "kozbeszerzes",
    "forint",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Intended Audience :: Other Audience",
    "Topic :: Office/Business",
    "Natural Language :: Hungarian",
    "Natural Language :: English",
]
dependencies = [
    "primecrest>=5.5.0",
]

[project.urls]
Source = "https://github.com/spyderps05/PrimeCrestConstMgmt"

[project.entry-points."openconstructionerp.partner_packs"]
hungary-hu = "openconstructionerp_hungary_hu:MANIFEST"

[project.entry-points."primecrest.partner_packs"]
hungary-hu = "openconstructionerp_hungary_hu:MANIFEST"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openconstructionerp_hungary_hu = [
    "onboarding.yaml",
    "rule_packs/*.json",
]
