[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "primecrest-korea-kr"
version = "0.1.0"
description = "Pre-configured country pack for South Korean construction - KBIM classification, KS standards, MOLIT Standard Specifications, Building Act, VAT 10%. Korean + English UI."
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.11"
authors = [
    { name = "Spyder Solutions", email = "support@primecrest.pk" },
]
keywords = ["primecrest", "partner-pack", "korea", "kbim", "ks-standards", "molit"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Intended Audience :: Other Audience",
    "Topic :: Office/Business",
    "Natural Language :: Korean",
    "Natural Language :: English",
]
dependencies = [
    "primecrest>=5.5.0",
]

[project.urls]
Source = "https://github.com/spyderps05/PrimeCrestConstMgmt"

[project.entry-points."openconstructionerp.partner_packs"]
korea-kr = "openconstructionerp_korea_kr:MANIFEST"

[project.entry-points."primecrest.partner_packs"]
korea-kr = "openconstructionerp_korea_kr:MANIFEST"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openconstructionerp_korea_kr = [
    "onboarding.yaml",
    "rule_packs/*.json",
]
