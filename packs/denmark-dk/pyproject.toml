[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "primecrest-denmark-dk"
version = "0.1.0"
description = "Country pack for Danish construction estimating - V&S specifications, AB 18/ABT 18 contracts, SfB/CCS classification, DKK with 25% moms. Danish + English UI."
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.11"
authors = [
    { name = "Spyder Solutions", email = "support@primecrest.pk" },
]
keywords = ["primecrest", "partner-pack", "denmark", "vs", "sfb", "ccs", "ab18"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Intended Audience :: Other Audience",
    "Topic :: Office/Business",
    "Natural Language :: Danish",
    "Natural Language :: English",
]
dependencies = [
    "primecrest>=5.5.0",
]

[project.urls]
Source = "https://github.com/spyderps05/PrimeCrestConstMgmt"

[project.entry-points."openconstructionerp.partner_packs"]
denmark-dk = "openconstructionerp_denmark_dk:MANIFEST"

[project.entry-points."primecrest.partner_packs"]
denmark-dk = "openconstructionerp_denmark_dk:MANIFEST"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openconstructionerp_denmark_dk = [
    "onboarding.yaml",
    "rule_packs/*.json",
]
