[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "primecrest-eleven-areas-framework"
version = "0.1.0"
description = "Owner's Project Control pack for PrimeCrest: two phases, one gate, eleven management areas, one frame document per area."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }
authors = [
    { name = "Spyder Solutions", email = "support@primecrest.pk" },
]
keywords = [
    "primecrest",
    "pack",
    "project-governance",
    "stage-gates",
    "owner",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Industry-Specific",
]
dependencies = [
    "openconstructionerp",
    "pydantic>=2.6",
]

[project.urls]
Source = "https://github.com/spyderps05/PrimeCrestConstMgmt"

[project.entry-points."openconstructionerp.packs"]
eleven-areas-framework = "openconstructionerp_eleven_areas_framework:MANIFEST"

[project.entry-points."primecrest.packs"]
eleven-areas-framework = "openconstructionerp_eleven_areas_framework:MANIFEST"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openconstructionerp_eleven_areas_framework = [
    "manifest.json",
    "locales/*.json",
    "catalogues/*/*.json",
    "demo/*.json",
]
