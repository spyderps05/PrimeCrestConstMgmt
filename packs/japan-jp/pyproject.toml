[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "primecrest-japan-jp"
version = "0.1.0"
description = "Pre-configured country pack for Japanese construction - Sekisan Kijun estimation standards, JASS specifications, Building Standards Act, consumption tax 10%. Japanese + English UI."
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.11"
authors = [
    { name = "Spyder Solutions", email = "support@primecrest.pk" },
]
keywords = ["primecrest", "partner-pack", "japan", "sekisan", "jass", "building-standards-act"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Intended Audience :: Other Audience",
    "Topic :: Office/Business",
    "Natural Language :: Japanese",
    "Natural Language :: English",
]
dependencies = [
    "primecrest>=5.5.0",
]

[project.urls]
Source = "https://github.com/spyderps05/PrimeCrestConstMgmt"

[project.entry-points."openconstructionerp.partner_packs"]
japan-jp = "openconstructionerp_japan_jp:MANIFEST"

[project.entry-points."primecrest.partner_packs"]
japan-jp = "openconstructionerp_japan_jp:MANIFEST"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openconstructionerp_japan_jp = [
    "onboarding.yaml",
    "rule_packs/*.json",
]
