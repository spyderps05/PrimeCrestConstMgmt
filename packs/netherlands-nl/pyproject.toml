[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "primecrest-netherlands-nl"
version = "0.1.0"
description = "Country pack for the Dutch market: NL/SfB classification, EUR currency, 21% BTW, RAW systematiek, STABU besteksystematiek, Bouwbesluit 2012 and BENG energy performance references."
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.11"
authors = [
    { name = "Spyder Solutions", email = "support@primecrest.pk" },
]
keywords = [
    "primecrest",
    "country-pack",
    "netherlands",
    "nlsfb",
    "raw",
    "stabu",
    "bouwbesluit",
    "btw",
    "eur",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Intended Audience :: Other Audience",
    "Topic :: Office/Business",
    "Natural Language :: Dutch",
    "Natural Language :: English",
]
dependencies = [
    "primecrest>=5.5.0",
]

[project.urls]
Source = "https://github.com/spyderps05/PrimeCrestConstMgmt"

[project.entry-points."openconstructionerp.partner_packs"]
netherlands-nl = "openconstructionerp_netherlands_nl:MANIFEST"

[project.entry-points."primecrest.partner_packs"]
netherlands-nl = "openconstructionerp_netherlands_nl:MANIFEST"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openconstructionerp_netherlands_nl = [
    "onboarding.yaml",
    "rule_packs/*.json",
]
